# CHISEL — Render Blueprint (free web service)
# Render dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are asked for once in the dashboard and never stored in git.
services:
  - type: web
    name: chisel-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: ENVIRONMENT
        value: production
      - key: DEMO_RETURN_OTP
        value: "false"
      # Render generates a random 256-bit secret for JWT + OTP hashing
      - key: SECRET_KEY
        generateValue: true
      # Neon connection string (Dashboard → Connect), e.g.
      # postgresql://user:pass@ep-xxx.region.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Brevo → SMTP & API → API keys (starts with xkeysib-)
      - key: BREVO_API_KEY
        sync: false
      # A sender address you verified in Brevo → Senders
      - key: EMAIL_SENDER_ADDRESS
        sync: false
      # Comma-separated emails allowed to call /api/admin/*
      - key: ADMIN_EMAILS
        sync: false
      # The Android app (Capacitor) runs at https://localhost and calls this API
      - key: CORS_ORIGINS
        value: https://localhost
      - key: POLLINATIONS_API_KEY
        sync: false
